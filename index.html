<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V-LAB • Digital Virtual Manual</title>
<style>
:root{--bg:#060914;--panel:rgba(15,23,42,.78);--panel2:#0f172a;--text:#f5f7ff;--muted:#9aa8bd;--line:#ffffff18;--cyan:#67e8f9;--violet:#8b5cf6;--green:#4ade80;--amber:#fbbf24;--shadow:0 24px 80px #0008}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 10% 0%,#15305a 0,#060914 36%),radial-gradient(circle at 90% 10%,#2b1450 0,#060914 35%);color:var(--text);min-height:100vh}button,input,select{font:inherit}.app{min-height:100vh}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid var(--line);backdrop-filter:blur(20px);position:sticky;top:0;z-index:10;background:#070b14cc}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--cyan)}.navlinks{display:flex;gap:8px}.nav button,.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);padding:11px 15px;border-radius:12px;cursor:pointer;transition:.2s}.nav button:hover,.btn:hover{transform:translateY(-2px);border-color:#ffffff35}.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#07101c;border:0;font-weight:800}.btn.ghost{background:transparent}.wrap{max-width:1180px;margin:auto;padding:52px 22px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:34px;align-items:center;min-height:72vh}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.15em;text-transform:uppercase;font-size:.78rem}.hero h1{font-size:clamp(3rem,7vw,6rem);line-height:.95;margin:16px 0}.gradient{background:linear-gradient(90deg,#fff,var(--cyan),#c4b5fd);-webkit-background-clip:text;color:transparent}.hero p,.muted{color:var(--muted);line-height:1.7}.hero-card,.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.hero-card{padding:28px}.orb{height:300px;border-radius:24px;background:radial-gradient(circle at 50% 45%,#67e8f955,transparent 28%),linear-gradient(135deg,#111d38,#170e2b);display:grid;place-items:center;border:1px solid #ffffff18}.orb .core{width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 0 100px #67e8f955;display:grid;place-items:center;color:#07101c;font-size:2.2rem;font-weight:900}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.section{padding:45px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{padding:22px}.card h3{margin:8px 0}.icon{font-size:2rem}.login{max-width:560px;margin:8vh auto}.form{display:grid;gap:14px}.form label{font-size:.9rem;color:#cbd5e1}.form input,.form select,.chatinput{width:100%;padding:14px;border-radius:13px;border:1px solid var(--line);background:#050914;color:var(--text);outline:none}.form input:focus,.form select:focus{border-color:var(--cyan)}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.pill{display:inline-flex;padding:6px 10px;border-radius:99px;background:#67e8f91a;color:var(--cyan);font-size:.75rem;font-weight:800}.subject{cursor:pointer;transition:.2s}.subject:hover{transform:translateY(-5px);border-color:#67e8f944}.exp{display:flex;justify-content:space-between;align-items:center;gap:15px;border:1px solid var(--line);padding:18px;border-radius:18px;margin:12px 0;background:#ffffff05}.video{width:100%;border-radius:18px;background:#000;max-height:580px}.two{display:grid;grid-template-columns:1.4fr .8fr;gap:20px}.steps{counter-reset:s}.step{position:relative;padding:16px 16px 16px 54px;border-bottom:1px solid var(--line)}.step:before{counter-increment:s;content:counter(s);position:absolute;left:15px;top:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#67e8f91a;color:var(--cyan);font-weight:800}.quiz{display:grid;gap:15px}.option{padding:13px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.option.selected{border-color:var(--cyan);background:#67e8f910}.result{padding:14px;border-radius:12px;background:#4ade8012;color:#86efac}.chat{min-height:320px;display:flex;flex-direction:column;gap:12px}.bubble{padding:12px 14px;border-radius:14px;background:#ffffff09;max-width:80%;line-height:1.5}.me{align-self:flex-end;background:#67e8f91a}.chatrow{display:flex;gap:10px;margin-top:auto}.progress{height:9px;background:#ffffff10;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:1s}.stage{display:flex;gap:12px;align-items:center;padding:13px;border-bottom:1px solid var(--line)}.check{color:var(--green)}footer{padding:35px 5%;text-align:center;color:#64748b;border-top:1px solid var(--line)}.hide{display:none!important}@media(max-width:850px){.hero,.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.navlinks{display:none}.hero{min-height:auto;padding-top:30px}}
</style></head><body><div class="app"><nav class="nav"><div class="brand">V<span>•</span>LAB</div><div class="navlinks"><button onclick="home()">Home</button><button onclick="login()">Student</button><button onclick="faculty()">Faculty</button><button onclick="assistant()">AI Assistant</button><button onclick="document.body.classList.toggle('light')">◐</button></div></nav><main id="root"></main><footer>V-LAB • Digital Virtual Manual • AI creates drafts, faculty verifies before publishing.</footer></div>
<script>
const root=document.getElementById('root');let user={name:'',college:'',role:''};let subject='';
const subjects={"Data Visualization":[['Experiment 1','Student Performance Data Visualization','LIVE'],['Experiment 2','Department Performance Analysis','DEMO'],['Experiment 3','Study Hours vs Marks','DEMO']],"Problem Solving using Python":[['Experiment 1','Basic Python Programs','DEMO'],['Experiment 2','Lists and Dictionaries','DEMO'],['Experiment 3','Functions and File Handling','DEMO']],"Web Designing":[['Experiment 1','Responsive HTML Page','DEMO'],['Experiment 2','CSS Layout and Styling','DEMO'],['Experiment 3','JavaScript Interaction','DEMO']]};
function home(){root.innerHTML=`<div class="wrap hero"><section><div class="eyebrow">Future-ready practical learning</div><h1>Learn Practical Skills <span class="gradient">Visually.</span></h1><p>V-LAB transforms laboratory manuals into guided digital practicals: visual tutorials, step-by-step practice and an AI doubt assistant.</p><div class="actions"><button class="btn primary" onclick="login()">Enter V-LAB →</button><button class="btn" onclick="faculty()">Faculty Portal</button></div></section><div class="hero-card"><div class="orb"><div class="core">V</div></div><h3>Manual → AI → Tutorial → Practice</h3><p class="muted">Faculty uploads the manual. AI prepares a draft tutorial and practice flow. Faculty verifies it before students see it.</p></div></div><div class="wrap section"><div class="grid"><div class="card"><div class="icon">🎬</div><h3>Visual Tutorials</h3><p class="muted">Watch the practical procedure instead of relying on text alone.</p></div><div class="card"><div class="icon">🧩</div><h3>Interactive Practice</h3><p class="muted">Check your understanding with practical decision points.</p></div><div class="card"><div class="icon">🤖</div><h3>AI Doubt Assistant</h3><p class="muted">Ask contextual questions while preparing for the practical.</p></div></div></div>`}
function login(){root.innerHTML=`<div class="wrap login"><div class="card"><div class="eyebrow">Secure portal entry</div><h2>Welcome to V-LAB</h2><p class="muted">Choose your college and portal role to continue.</p><form class="form" onsubmit="enter(event)"><label>Name<input id="name" required placeholder="Your name"></label><label>College<select id="college"><option>Choose college</option><option>ABC College of Engineering</option><option>XYZ Institute of Technology</option><option>Demo College</option></select></label><label>Portal Role<select id="role"><option>Student</option><option>Faculty</option></select></label><button class="btn primary">Enter V-LAB →</button></form></div></div>`}
function enter(e){e.preventDefault();user={name:name.value,college:college.value,role:role.value};user.role==='Faculty'?faculty():dashboard()}
function dashboard(){root.innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">Student workspace</div><h1>Hi, ${user.name} 👋</h1><p class="muted">${user.college} • Select a subject to begin.</p></div><button class="btn" onclick="login()">Switch Portal</button></div><div class="grid section">${Object.keys(subjects).map((s,i)=>`<div class="card subject" onclick="subjectPage('${s}')"><div class="icon">${['📊','🐍','🌐'][i]}</div><span class="pill">3 experiments</span><h3>${s}</h3><p class="muted">Guided practical learning with visual explanations.</p></div>`).join('')}</div></div>`}
function subjectPage(s){subject=s;root.innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">Subject</div><h1>${s}</h1></div><button class="btn" onclick="dashboard()">← Subjects</button></div><div class="section">${subjects[s].map((e,i)=>`<div class="exp"><div><span class="pill">${e[2]}</span><h3>${e[0]} — ${e[1]}</h3><p class="muted">${s==='Data Visualization'&&i===0?'Visual tutorial available with practice mode.':'Demo experiment structure ready for future content.'}</p></div><button class="btn primary" onclick="experiment(${i})">Open →</button></div>`).join('')}</div></div>`}
function experiment(i){if(subject==='Data Visualization'&&i===0){root.innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">Data Visualization • Experiment 1</div><h1>Student Performance Data Visualization</h1></div><button class="btn" onclick="subjectPage(subject)">← Experiments</button></div><div class="two section"><div class="card"><video class="video" controls preload="metadata"><source src="videos/data-visualization-experiment-1.mp4" type="video/mp4"></video><p class="muted">Watch the uploaded practical tutorial. Use the controls to pause and repeat each action.</p></div><div class="card"><h3>Procedure</h3><div class="steps"><div class="step">Open Power BI</div><div class="step">Import the dataset</div><div class="step">Create a chart</div><div class="step">Analyze the result</div><div class="step">Practice the workflow</div></div><div class="actions"><button class="btn primary" onclick="practice()">Start Practice</button><button class="btn" onclick="assistant('data')">Ask AI</button></div></div></div></div>`}else{root.innerHTML=`<div class="wrap"><div class="card"><span class="pill">DEMO EXPERIMENT</span><h1>${subjects[subject][i][1]}</h1><p class="muted">This experiment is included in the prototype structure. Content can be generated and approved through the faculty workflow.</p><button class="btn primary" onclick="subjectPage(subject)">Back to experiments</button></div></div>`}}
function practice(){let answers=[null,null,null];root.innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">Practice Mode</div><h1>Build the visualization</h1></div><button class="btn" onclick="experiment(0)">← Tutorial</button></div><div class="card section quiz"><div><b>1. Which dataset should you import?</b><div class="option" onclick="pick(this,0,'Student Performance.xlsx')">Student Performance.xlsx</div><div class="option" onclick="pick(this,0,'Attendance.xlsx')">Attendance.xlsx</div></div><div><b>2. Which chart is used in the tutorial?</b><div class="option" onclick="pick(this,1,'Bar Chart')">Bar Chart</div><div class="option" onclick="pick(this,1,'Pie Chart')">Pie Chart</div></div><div><b>3. How are fields mapped?</b><div class="option" onclick="pick(this,2,'Student → Axis | Marks → Values')">Student → Axis | Marks → Values</div><div class="option" onclick="pick(this,2,'Marks → Axis | Student → Values')">Marks → Axis | Student → Values</div></div><button class="btn primary" onclick="checkQuiz()">Check Answers</button><div id="quizResult"></div></div></div>`;window.answers=answers}
function pick(el,n,v){document.querySelectorAll('.option').forEach(x=>{if(x.parentElement===el.parentElement)x.classList.remove('selected')});el.classList.add('selected');answers[n]=v}
function checkQuiz(){let correct=['Student Performance.xlsx','Bar Chart','Student → Axis | Marks → Values'];let score=answers.filter((a,i)=>a===correct[i]).length;document.getElementById('quizResult').innerHTML=`<div class="result">You scored <b>${score}/3</b>. ${score===3?'Excellent — practical ready!':'Review the tutorial and try again.'}</div>`}
function assistant(context){root.innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">AI Doubt Assistant</div><h1>Ask about your practical</h1></div><button class="btn" onclick="dashboard()">← Dashboard</button></div><div class="card section chat" id="chat"><div class="bubble">Hi! I can help with the Data Visualization Experiment 1. Ask about the dataset, chart, fields or purpose.</div><div class="chatrow"><input id="chatinput" class="chatinput" placeholder="e.g. What is the purpose of the bar chart?"><button class="btn primary" onclick="ask()">Send</button></div></div></div>`}
function ask(){let q=chatinput.value.trim();if(!q)return;let chat=document.getElementById('chat');chat.insertAdjacentHTML('afterbegin',`<div class="bubble me">${q.replaceAll('<','&lt;')}</div>`);let l=q.toLowerCase(),a=l.includes('purpose')?'The chart helps visualize student marks so performance patterns are easier to compare.':l.includes('chart')?'The tutorial uses a Bar Chart.':l.includes('axis')||l.includes('value')?'Map Student to Axis and Marks to Values.':l.includes('dataset')||l.includes('excel')?'Import Student Performance.xlsx.':'Try asking about the dataset, chart, axis/values, or purpose.';chat.insertAdjacentHTML('afterbegin',`<div class="bubble">${a}</div>`);chatinput.value=''}
function faculty(){root.innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">Faculty workspace</div><h1>Turn manuals into practical tutorials.</h1><p class="muted">Upload a laboratory manual. V-LAB simulates AI extraction, tutorial preparation and practice generation, followed by faculty approval.</p></div><button class="btn" onclick="home()">Home</button></div><div class="two section"><div class="card"><h3>1. Upload Laboratory Manual</h3><input id="manual" type="file" accept=".pdf,.doc,.docx,.txt" style="margin:18px 0;width:100%"><button class="btn primary" onclick="processManual()">Start AI Processing</button><div id="process" class="hide"><div class="progress" style="margin-top:20px"><div class="bar" id="bar"></div></div><div id="stages" style="margin-top:15px"></div></div></div><div class="card"><span class="pill">Human in the loop</span><h3>Faculty verification</h3><p class="muted">AI prepares a draft. Faculty checks the procedure, narration and practice questions before publishing.</p><button class="btn" onclick="alert('Draft preview opened in the full version.')">Preview Draft</button> <button class="btn primary" onclick="alert('Draft approved and published to students.')">Approve & Publish</button></div></div></div>`}
function processManual(){if(!manual.files.length){alert('Please choose a laboratory manual first.');return}document.getElementById('process').classList.remove('hide');let stages=['Extracting procedure from manual','Identifying experiment steps','Generating narration','Preparing visual tutorial draft','Creating practice questions'];let s=document.getElementById('stages');s.innerHTML=stages.map(x=>`<div class="stage"><span class="check">✓</span>${x}</div>`).join('');let b=0;let t=setInterval(()=>{b+=20;document.getElementById('bar').style.width=b+'%';if(b>=100)clearInterval(t)},550)}
home();
</script></body></html>
